<!DOCTYPE html>
<html>
  <head>
    <title>𡗶𡐙容和</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Should this be by height instead of width for tategaki? -->
    <meta charset="utf-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.5/lunar.min.js"></script>
    <script src="./lodash.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <h1 id="curr-weather">當查究時節</h1>

    <div class="widget">
      <span class="one-line">
        <b>曆陰</b>
        <span id="lunar-date">空𤑟</span>
        &#12288;
        <span id="curr-jieqi">空𤑟</span>
      </span>

      <span class="one-line">
        <b>曆陽</b>
        <span id="western-date">空𤑟</span>
      </span>
    </div>

    <table id="hourly" class="widget force-rtl" dir="rtl">
      <tr>
        <td><!--This column is for sunrise/sunset--></td>
        <th>現在</th>
        <td id="curr-hour-weather">空𤑟</td>
        <td id="curr-hour-temp" class="left-align"></td>
      </tr>
    </table>

    <div id="wind" class="widget">
      <b>𩙍</b>
      <span id="wind-info">空𤑟</span>
    </div>

    <table id="daily" class="widget">
      <tr>
        <td id="today-solar-term"></td>
        <th>𣋚𫢩</th>
        <td id="today-weather">空𤑟</td>
        <td id="today-high"></td>
        <td id="today-low"></td>
      </tr>
    </table>

    <footer>
      <h3>𥱬注</h3>
      張呢得<u>𤞺氷</u>譯自版㭲𧵑<u>巍洰</u>。裊悶㨂𢵰，𢝙𢚸追及<a href="https://github.com/IcefoxKishi/nom-weather">Github</a>。
      <br>
      張呢使用<a href="https://open-meteo.com/">Open-Meteo</a>蹺紙法<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。
      <br>
      術算倂𣈗陰歷得發展𤳄<a href="https://www.xemamlich.uhm.vn/">胡玉德</a>。
    </footer>
  </body>
</html>
