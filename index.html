<!DOCTYPE html>
<html>
  <head>
    <title>天下無恙</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Should this be by height instead of width for tategaki? -->
    <meta charset="utf-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.5/lunar.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <h1 id="curr-weather">方求氣候</h1>

    <div class="widget">
      <span class="one-line">
        <b>農曆</b>
        <span id="lunar-date">不明</span>
      </span>

      <span class="one-line">
        <b>西曆</b>
        <span id="western-date">不明</span>
      </span>
    </div>

    <table id="hourly" class="widget force-rtl" dir="rtl">
      <tr>
        <th>今</th>
        <td id="curr-hour-weather">不明</td>
        <td id="curr-hour-temp"></td>
      </tr>
    </table>

    <table id="daily" class="widget">
      <tr>
        <th>今日</th>
        <td id="today-weather">不明</td>
        <td id="today-high"></td>
        <td id="today-low"></td>
      </tr>
    </table>

    <footer>此網站以<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>用<a href="https://open-meteo.com/">Open-Meteo</a>。</footer>
  </body>
</html>
